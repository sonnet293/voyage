<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Battle Frontier | Login</title>
</head>
<body class="login-page">

    <main class="login-card">
        <img src="img/마릴.png" alt="" class="login-logo">
        <h1 class="login-title">Battle Frontier</h1>

        <form id="loginForm" class="login-form">
            <label class="field">
                <span>email</span>
                <input type="email" id="email" placeholder="email" autocomplete="email" required />
            </label>
            <label class="field">
                <span>password</span>
                <input type="password" id="password" placeholder="passsword" autocomplete="current-password" required />
            </label>
            <button type="submit" id="loginBtn" class="btn btn-primary">Login</button>
            <p id="message" class="form-message" role="alert"></p>
        </form>
    </main>

    <script type="module" src="js/login.js"></script>
    
</body>
</html>
